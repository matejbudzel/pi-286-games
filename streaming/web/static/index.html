<!doctype html>
<html lang="sk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi286 web runtime</title>
<link rel="stylesheet" href="/style.css">
<main>
  <h1>PI286</h1>
  <section id="menu">
    <label>Obraz <select id="scaling"><option value="nearest">nearest</option><option value="linear-v">linear-v</option><option value="crt-lite">crt-lite</option></select></label>
    <label>Transport <select id="transport"><option value="poll">HTTP polling</option><option value="websocket">WebSocket experiment</option></select></label>
    <p id="status">Pripájam sa…</p>
    <div id="games"></div>
  </section>
  <section id="player" hidden>
    <div id="screen-wrap">
      <canvas id="screen" width="640" height="480"></canvas>
      <output id="hud" aria-live="off">Čakám na prvý frame…</output>
    </div>
    <p><kbd>F1</kbd> späť do menu · <kbd>F8</kbd> HUD · šípky/klávesnica ovládajú hru</p>
  </section>
</main>
<script src="/app.js"></script>
