<!doctype html>
<html lang="sk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi286 web runtime</title>
<link rel="stylesheet" href="/style.css">
<main>
  <h1>PI286</h1>
  <section id="menu">
    <div id="games"></div>
    <section id="pre-game" hidden><h2 id="pre-game-title"></h2><p id="pre-game-hint"></p><div id="pre-game-instructions"></div><div id="pre-game-pad"></div><button id="pre-game-start" type="button">Spustiť</button><button id="pre-game-back" type="button">Späť</button></section>
    <div id="menu-options"><label>Ovládanie <select id="input-mode"><option value="both" selected>klávesnica + podložka</option><option value="keyboard">len klávesnica</option><option value="pad">len podložka</option></select></label><label>Obraz <select id="scaling"><option value="nearest">nearest</option><option value="linear-v">linear-v</option><option value="crt-lite" selected>crt-lite</option></select></label><label>Transport <select id="transport"><option value="poll">HTTP polling</option><option value="websocket" selected>WebSocket</option></select></label></div>
    <p id="status">Pripájam sa…</p>
  </section>
  <section id="player" hidden>
    <div id="screen-wrap">
      <canvas id="screen" width="640" height="480"></canvas>
      <output id="hud" aria-live="off">Čakám na prvý frame…</output>
    </div>
    <div class="player-controls">
      <button id="panic" type="button">F1 · ukončiť hru</button>
      <button id="hud-toggle" type="button" aria-pressed="false">F8 · HUD</button>
      <span><kbd>F1</kbd> späť do menu · <kbd>F8</kbd> HUD · šípky/klávesnica ovládajú hru</span>
    </div>
    <section id="virtual-keys" aria-label="Virtuálne klávesy">
      <div class="virtual-key-row">
        <button type="button" data-virtual-key="ESC">Esc</button>
        <button type="button" data-virtual-key="CTRL" data-modifier="true" aria-pressed="false">Ctrl</button>
        <button type="button" data-virtual-key="SHIFT" data-modifier="true" aria-pressed="false">Shift</button>
        <button type="button" data-virtual-key="ALT" data-modifier="true" aria-pressed="false">Alt</button>
        <button type="button" data-virtual-key="META" data-modifier="true" aria-pressed="false">Meta<br><small>Win/Cmd</small></button>
        <button type="button" data-virtual-key="DELETE">Del</button>
      </div>
      <div class="virtual-text-entry">
        <button id="virtual-keyboard" type="button">⌨ Písať</button>
        <input id="text-entry" type="text" inputmode="text" enterkeyhint="enter" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Písať do hry" aria-label="Písať do hry">
      </div>
    </section>
    <section id="virtual-pad" aria-label="Virtuálny tanečný pad">
      <div class="pad-system-buttons">
        <button id="pad-select" type="button">SELECT<br><small>F1 · späť</small></button>
        <button id="pad-start" type="button" data-pad-button="8">START</button>
      </div>
      <div class="pad-directions" aria-label="Osem smerov">
        <button type="button" data-pad-button="6" aria-label="Hore vľavo">↖</button>
        <button type="button" data-pad-button="2" aria-label="Hore">↑</button>
        <button type="button" data-pad-button="7" aria-label="Hore vpravo">↗</button>
        <button type="button" data-pad-button="0" aria-label="Vľavo">←</button>
        <span aria-hidden="true"></span>
        <button type="button" data-pad-button="3" aria-label="Vpravo">→</button>
        <button type="button" data-pad-button="4" aria-label="Dole vľavo">↙</button>
        <button type="button" data-pad-button="1" aria-label="Dole">↓</button>
        <button type="button" data-pad-button="5" aria-label="Dole vpravo">↘</button>
      </div>
    </section>
  </section>
</main>
<script type="module" src="/app.js"></script>
