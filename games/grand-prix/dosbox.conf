[sdl]
fullscreen=true
output=surface

[dosbox]
machine=ega
memsize=8

[cpu]
core=normal
# Approximate a modest 286-class machine while keeping Pi B+ load predictable.
cycles=fixed 3000

# The Pi 1 needs a deliberately large buffer for this game. It adds a little
# audio latency, but is more resistant to underruns while Grand Prix is busy.
# This is intentionally game-specific: other titles retain DOSBox defaults.
[mixer]
rate=22050
blocksize=2048
prebuffer=100
