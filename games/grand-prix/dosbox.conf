[sdl]
fullscreen=true
output=surface

[dosbox]
machine=ega
memsize=8

[cpu]
core=normal
# Approximate a modest 286-class machine while keeping Pi B+ load predictable.
cycles=fixed 3000

# The Pi 1 benefits from lower mixer work and a larger buffer for this game.
# This is intentionally game-specific: other titles retain DOSBox defaults.
[mixer]
rate=22050
blocksize=1024
prebuffer=60
