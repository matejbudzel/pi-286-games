# Display name shown in the launcher.
name=Example Game

# Directory relative to game_data_root.
data_dir=example-game

# Executable or command the remote DOSBox session starts.
exe=GAME.EXE

# The dance-pad map and Slovak labels.
ddr_file=ddr.conf

# Optional ZIP or RAR archive used only when data_dir does not yet exist. This
# may be an HTTPS URL or an absolute/local filesystem path. Existing data is
# untouched. asset_zip remains accepted for compatibility.
# asset_archive=/path/to/example-game.zip
