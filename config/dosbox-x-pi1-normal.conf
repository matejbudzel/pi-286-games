# Same Pi 1 workload profile as dosbox-x-pi1-dynrec.conf, with interpreter CPU.
[dosbox]
machine=ega
memsize=8

[sdl]
fullscreen=true
fulldouble=false
fullresolution=640x480
windowresolution=640x480
output=surface

[cpu]
core=normal
cputype=286
cycles=auto
cycleup=500
cycledown=500

[render]
frameskip=0
aspect=true
scaler=none

[mixer]
nosound=false
rate=22050
blocksize=1024
prebuffer=20

[speaker]
pcspeaker=true
pcrate=22050
tandy=off
disney=false

[sblaster]
sbtype=none

[midi]
mpu401=none

[joystick]
joysticktype=none
